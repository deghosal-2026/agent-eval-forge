[project]
name = "agent-eval-forge"
version = "0.1.0"
description = "A framework-agnostic evaluation harness for tool-using AI agents. Define scenario packs, run agents consistently, score outcomes and trajectories, and gate releases with evidence."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "deghosal-2026" }]
keywords = ["agent", "evaluation", "testing", "llm", "ai", "scoring", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "click>=8.1",
    "httpx>=0.27",
    "rich>=13.7",
]

[project.optional-dependencies]
judge = [
    "openai>=1.30",
    "anthropic>=0.30",
]
langgraph = [
    "langgraph>=0.2",
]
pydanticai = [
    "pydantic-ai>=0.0.10",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
evalforge = "evalforge.cli:main"

[project.entry-points."evalforge.scorers"]
# Registered via @register_scorer decorator in evalforge.scoring.registry

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalforge"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "evalforge(pack=None, agent=None): run test with EvalForge scenarios",
    "evalforge_tags(tag1, tag2, ...): filter scenarios by tags",
    "omlx: integration tests requiring a running omlx server",
    "docker: integration tests requiring a running Docker daemon",
    "slow: tests that may take longer to complete",
    "field: field tests against real agents from GitHub",
]
filterwarnings = [
    # Expected: `Expected.schema` is a spec-mandated field name that shadows
    # pydantic's BaseModel.schema(); suppressed per-field with a noqa comment.
    "ignore:Field name \"schema\" in \"Expected\" shadows an attribute in parent \"BaseModel\"",
]

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20260724",
]

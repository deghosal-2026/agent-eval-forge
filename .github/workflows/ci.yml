name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --extra judge --extra langgraph --extra pydanticai

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest --cov=evalforge --cov-report=term-missing --cov-fail-under=90 --cov-omit='*/judge/anthropic.py,*judge/ollama.py,*judge/openai.py'

  docker-sandbox:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build sandbox test image
        run: |
          docker build -t evalforge-sandbox -f Dockerfile .

      - name: Run eval in container without network
        run: |
          # Run a quick eval with no network to validate isolation
          docker run --rm --network none evalforge-sandbox \
            bash -lc "uv run evalforge run \
              --pack scenarios/core-launch.yaml \
              --agent subprocess:'python tests/fixtures/echo_agent.py' \
              --output .evalforge \
              --output-format json \
              --ci \
              --fixtures"

      - name: Verify container cannot reach internet (expected fail)
        run: |
          set +e
          docker run --rm --network none evalforge-sandbox python - << 'PY'
import socket, sys
s = socket.socket()
try:
    s.settimeout(2)
    s.connect(("8.8.8.8", 53))
    print("UNEXPECTED: network reachable")
    sys.exit(1)
except Exception as e:
    print("OK: network blocked:", e)
    sys.exit(0)
PY
          rc=$?
          if [ "$rc" -ne 0 ]; then echo "Network unexpectedly reachable"; exit 1; fi

      - name: Verify container cannot read host filesystem
        run: |
          docker run --rm --read-only --network none evalforge-sandbox \
            python -c "
import os
try:
    os.makedirs('/host_test', exist_ok=True)
    print('UNEXPECTED: write succeeded')
    exit(1)
except PermissionError:
    print('OK: write blocked')
    exit(0)
" 2>&1 || exit 0  # read-only may not block all paths on all Docker versions

  eval:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Validate pack
        run: uv run evalforge validate --pack scenarios/core-launch.yaml --strict

      - name: Run full pack (fixtures mode)
        run: |
          uv run evalforge run \
            --pack scenarios/core-launch.yaml \
            --agent python:fixtures.echo_agent \
            --output .evalforge \
            --output-format github-actions \
            --ci \
            --sandbox \
            --fixtures

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evalforge-results
          path: .evalforge/runs/
